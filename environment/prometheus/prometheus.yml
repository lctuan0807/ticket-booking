global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ticket-booking-prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: "/metrics"

  - job_name: "ticket-booking-springboot"
    scrape_interval: 5s
    static_configs:
      - targets: [ "host.docker.internal:8080" ]
    metrics_path: "/actuator/prometheus"

  - job_name: "ticket-booking-mysql"
    scrape_interval: 5s
    static_configs:
      - targets: [ "host.docker.internal:9104" ]
    metrics_path: "/metrics"
